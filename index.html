<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142a36">
<title>DRO.TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Reset mínimo. El resto del estilo vive en css/tokens.css y css/app.css. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-fondo); }
</style>
</head>
<body>
<div id="app"></div>

<!-- Librerías vendorizadas en vendor/, nunca un <script src="https://..."> a un CDN. -->
<script src="vendor/supabase.js"></script>
<script src="vendor/chart.js"></script>

<script type="module">
  // ==========================================================
  // Armazón de la app.
  //
  // Una pantalla por módulo en app/. Agregar una es agregar un
  // archivo y una línea en PANTALLAS: sin bundler, sin monolito.
  //
  // La cabecera lleva tres cosas que valen para todas las pantallas:
  // quién entró y con qué rol, a quién está mirando (si es coach), y
  // el logo, que siempre vuelve al inicio.
  // ==========================================================
  import { protegerApp, cerrarSesion } from './app/auth.js';
  import { iniciarSesionApp, sesion, cambiarSujeto, esPropio } from './app/sesion.js';
  import { montarInicio } from './app/inicio.js';
  import { montarInstrucciones } from './app/instrucciones.js';
  import { montarEntrenar } from './app/entrenar.js';
  import { montarProgreso } from './app/progreso.js';
  import { montarComposicion } from './app/composicion.js';
  import { montarRutina } from './app/rutina.js';
  import { montarAdmin } from './app/admin.js';
  import { montarMiCoach } from './app/mi-coach.js';
  import { esc } from './app/ui.js';

  const PANTALLAS = [
    { id: 'inicio',        titulo: 'Inicio',      montar: montarInicio,        oculta: true },
    { id: 'entrenar',      titulo: 'Entrenar',    montar: montarEntrenar },
    { id: 'progreso',      titulo: 'Progreso',    montar: montarProgreso },
    { id: 'composicion',   titulo: 'Composición', montar: montarComposicion },
    { id: 'rutina',        titulo: 'Rutina',      montar: montarRutina },
    // Fuera de la navegación: se entra por el botón del inicio, que solo
    // aparece si hay un coach asignado. La pantalla misma se explica si
    // no hay ninguno, así que entrar por el # tampoco rompe nada.
    { id: 'mi-coach',      titulo: 'Mi coach',    montar: montarMiCoach,       oculta: true },
    { id: 'instrucciones', titulo: 'Cómo se usa', montar: montarInstrucciones, oculta: true },
    // Fuera de la navegación: se entra por el botón del inicio, que solo
    // ve el administrador. La pantalla vuelve a comprobar el rol, porque
    // esconder un botón no es un permiso.
    { id: 'admin',         titulo: 'Administración', montar: montarAdmin,      oculta: true },
  ];

  const ROLES = { atleta: 'Atleta', coach: 'Coach', admin: 'Administrador' };

  async function arrancar({ perfil }) {
    await iniciarSesionApp(perfil);
    let actual = 'inicio';

    document.getElementById('app').innerHTML = `
      <div class="app-marco">
        <header class="app-cabecera">
          <button class="app-marca" type="button" id="ir-inicio" title="Volver al inicio">DRO.TRACKER</button>

          <div class="identidad">
            <span class="identidad-nombre">${esc(perfil.nombre || perfil.email)}</span>
            <span class="identidad-rol">${esc(ROLES[perfil.rol] || perfil.rol)}</span>
          </div>

          ${sesion.atletas.length ? `
            <label class="sujeto">
              <span class="sujeto-etiqueta">Viendo a</span>
              <select id="sel-sujeto" class="entrada entrada--select entrada--sujeto">
                <option value="${esc(perfil.id)}">Yo</option>
                ${sesion.atletas.map((a) => `
                  <option value="${esc(a.id)}">${esc(a.nombre || a.email)}</option>`).join('')}
              </select>
            </label>` : ''}

          <nav class="app-nav">
            ${PANTALLAS.filter((p) => !p.oculta).map((p) => `
              <button class="app-nav-item" data-pantalla="${p.id}">${esc(p.titulo)}</button>`).join('')}
          </nav>
          <button class="app-salir" id="salir" type="button">Salir</button>
        </header>

        <div class="aviso-sujeto" id="aviso-sujeto" hidden></div>
        <main class="app-cuerpo" id="cuerpo"></main>
      </div>`;

    const cuerpo = document.getElementById('cuerpo');
    const aviso  = document.getElementById('aviso-sujeto');

    function ir(id) {
      const p = PANTALLAS.find((x) => x.id === id);
      if (!p?.montar) return;
      actual = id;

      document.querySelectorAll('[data-pantalla]').forEach((b) => {
        b.classList.toggle('app-nav-item--activo', b.dataset.pantalla === id);
      });
      if (location.hash.slice(1) !== id) history.replaceState(null, '', `#${id}`);

      // La franja de "estás viendo a X" acompaña a todas las pantallas:
      // registrar por error en la cuenta de otro es un daño silencioso,
      // del que nadie se entera hasta semanas después.
      aviso.hidden = esPropio();
      aviso.innerHTML = esPropio() ? '' :
        `Estás viendo los datos de <strong>${esc(sesion.sujeto.nombre || sesion.sujeto.email)}</strong>,
         no los tuyos. <button type="button" class="enlace" id="volver-a-mi">Volver a lo mío</button>`;
      document.getElementById('volver-a-mi')?.addEventListener('click', () => {
        const sel = document.getElementById('sel-sujeto');
        if (sel) sel.value = sesion.yo.id;
        cambiarSujeto(sesion.yo.id);
        ir(actual);
      });

      p.montar(cuerpo, perfil, ir);
    }

    document.getElementById('salir').addEventListener('click', cerrarSesion);
    document.getElementById('ir-inicio').addEventListener('click', () => ir('inicio'));
    document.querySelectorAll('[data-pantalla]').forEach((b) => {
      b.addEventListener('click', () => ir(b.dataset.pantalla));
    });

    // Cambiar de persona vuelve a montar la pantalla actual: la elección
    // se hace UNA VEZ y viaja con quien navega.
    document.getElementById('sel-sujeto')?.addEventListener('change', (ev) => {
      cambiarSujeto(ev.target.value);
      ir(actual);
    });

    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (id && id !== actual && PANTALLAS.some((p) => p.id === id)) ir(id);
    });

    const inicial = PANTALLAS.find((p) => p.id === location.hash.slice(1));
    ir(inicial ? inicial.id : 'inicio');
  }

  protegerApp({ alEntrar: arrancar });
</script>
</body>
</html>
