<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRO.TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<style>
  /* Reset mínimo. El resto del estilo vive en css/tokens.css y en cada módulo de app/. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-fondo); }
</style>
</head>
<body>
<div id="app"></div>

<!-- Librerías vendorizadas en vendor/, nunca un <script src="https://..."> a un CDN. -->
<script src="vendor/supabase.js"></script>

<script type="module">
  import { protegerApp, cerrarSesion } from './app/auth.js';

  // Placeholder hasta que existan las pantallas reales (rutina, entrenar,
  // progreso, composición, admin) — cada una su propio módulo en app/, como
  // manda CLAUDE.md. Esto solo confirma que el login end-to-end funciona.
  function pantallaInicio({ perfil }) {
    const cont = document.getElementById('app');
    cont.innerHTML = `
      <div class="inicio-envoltura">
        <div class="inicio-tarjeta">
          <h1 class="inicio-marca">DRO.TRACKER</h1>
          <p class="inicio-texto">
            Hola, <strong>${escHtml(perfil.nombre || perfil.email)}</strong>.
            Sesión activa como <strong>${escHtml(perfil.rol)}</strong>.
          </p>
          <p class="inicio-nota">
            Las pantallas de rutina, entrenamiento, progreso y composición
            todavía no están montadas — esto solo prueba que Supabase Auth y
            el estado de la cuenta funcionan de punta a punta.
          </p>
          <button id="inicio-salir" class="inicio-boton" type="button">Cerrar sesión</button>
        </div>
      </div>`;
    document.getElementById('inicio-salir').addEventListener('click', cerrarSesion);
  }

  function escHtml(v) {
    return String(v).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  const estilo = document.createElement('style');
  estilo.textContent = `
    .inicio-envoltura {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--esp-5);
      font-family: var(--fuente-texto);
      color: var(--color-texto);
    }
    .inicio-tarjeta {
      max-width: var(--ancho-tarjeta);
      width: 100%;
      background: var(--color-superficie);
      border: var(--borde-fino);
      border-radius: var(--radio-lg);
      box-shadow: var(--sombra-md);
      padding: var(--esp-6);
      display: flex;
      flex-direction: column;
      gap: var(--esp-4);
    }
    .inicio-marca {
      font-family: var(--fuente-titulo);
      font-weight: var(--peso-fuerte);
      font-size: var(--texto-2xl);
      margin: 0;
      color: var(--color-acento-fuerte);
    }
    .inicio-texto { margin: 0; color: var(--color-texto-tenue); line-height: var(--interlinea-normal); }
    .inicio-texto strong { color: var(--color-texto); }
    .inicio-nota { margin: 0; font-size: var(--texto-sm); color: var(--color-texto-debil); }
    .inicio-boton {
      align-self: flex-start;
      cursor: pointer;
      padding: var(--esp-3) var(--esp-5);
      font-family: var(--fuente-texto);
      font-weight: var(--peso-semi);
      color: var(--color-texto-sobre-acento);
      background: var(--color-acento);
      border: none;
      border-radius: var(--radio-sm);
    }
    .inicio-boton:hover { background: var(--color-acento-fuerte); }
  `;
  document.head.appendChild(estilo);

  protegerApp({ alEntrar: pantallaInicio });
</script>
</body>
</html>
