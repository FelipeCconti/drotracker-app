<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142a36">
<title>DRO.TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Reset mínimo. El resto del estilo vive en css/tokens.css y css/app.css. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-fondo); }
</style>
</head>
<body>
<div id="app"></div>

<!-- Librerías vendorizadas en vendor/, nunca un <script src="https://..."> a un CDN. -->
<script src="vendor/supabase.js"></script>
<script src="vendor/chart.js"></script>

<script type="module">
  // ==========================================================
  // Armazón de la app.
  //
  // Una pantalla por módulo en app/. Agregar una es agregar un
  // archivo y una línea en PANTALLAS: sin bundler, sin monolito.
  // ==========================================================
  import { protegerApp, cerrarSesion } from './app/auth.js';
  import { montarEntrenar } from './app/entrenar.js';
  import { montarProgreso } from './app/progreso.js';
  import { montarComposicion } from './app/composicion.js';
  import { montarRutina } from './app/rutina.js';
  import { esc } from './app/ui.js';

  const PANTALLAS = [
    { id: 'entrenar',    titulo: 'Entrenar',    montar: montarEntrenar },
    { id: 'progreso',    titulo: 'Progreso',    montar: montarProgreso },
    { id: 'composicion', titulo: 'Composición', montar: montarComposicion },
    { id: 'rutina',      titulo: 'Rutina',      montar: montarRutina },
  ];

  function arrancar({ perfil }) {
    document.getElementById('app').innerHTML = `
      <div class="app-marco">
        <header class="app-cabecera">
          <h1 class="app-marca">DRO.TRACKER</h1>
          <nav class="app-nav">
            ${PANTALLAS.map((p) => `
              <button class="app-nav-item" data-pantalla="${p.id}"
                      ${p.montar ? '' : 'disabled title="Todavía no está montada"'}>
                ${esc(p.titulo)}
              </button>`).join('')}
          </nav>
          <button class="app-salir" id="salir" type="button">Salir</button>
        </header>
        <main class="app-cuerpo" id="cuerpo"></main>
      </div>`;

    const cuerpo = document.getElementById('cuerpo');
    document.getElementById('salir').addEventListener('click', cerrarSesion);

    function ir(id) {
      const p = PANTALLAS.find((x) => x.id === id);
      if (!p?.montar) return;
      document.querySelectorAll('[data-pantalla]').forEach((b) => {
        b.classList.toggle('app-nav-item--activo', b.dataset.pantalla === id);
      });
      // El hash mantiene la pantalla al recargar y hace que el botón
      // "atrás" del teléfono haga lo esperable.
      if (location.hash.slice(1) !== id) history.replaceState(null, '', `#${id}`);
      p.montar(cuerpo, perfil);
    }

    document.querySelectorAll('[data-pantalla]').forEach((b) => {
      b.addEventListener('click', () => ir(b.dataset.pantalla));
    });

    const inicial = PANTALLAS.find((p) => p.id === location.hash.slice(1) && p.montar);
    ir(inicial ? inicial.id : 'entrenar');
  }

  protegerApp({ alEntrar: arrancar });
</script>
</body>
</html>
